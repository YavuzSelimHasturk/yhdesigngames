<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yh_design Games</title>
<meta name="description" content="yh_design Games: simple, fun mobile games. Get our games on Google Play and follow us on TikTok, YouTube, Instagram and Facebook.">
<meta property="og:title" content="yh_design Games">
<meta property="og:description" content="Simple, fun mobile games. Get them on Google Play.">
<meta name="theme-color" content="#101a33">
<link rel="icon" type="image/png" href="logo.png">
<meta property="og:image" content="logo.png">
<style>
  :root{
    --navy:#101a33; --navy-2:#18264a; --card:#1d2d55; --line:#2b3d6b;
    --orange:#f28c28; --orange-2:#ffa24a; --ivory:#f6efe2; --muted:#aab4cc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(120% 80% at 50% 0%, var(--navy-2) 0%, var(--navy) 60%);
    color:var(--ivory); display:flex; justify-content:center; padding:56px 20px 40px;
  }
  main{width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; gap:28px}
  .logo{width:112px;height:112px;border-radius:50%;display:block;box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .logo-fallback{
    width:104px;height:104px;border-radius:26px;background:var(--orange);
    display:grid;place-items:center;font-weight:800;font-size:44px;letter-spacing:-2px;color:var(--navy);
    box-shadow:0 12px 30px rgba(0,0,0,.35)
  }
  header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
  h1{font-size:26px;font-weight:750;letter-spacing:-.3px}
  .tag{color:var(--muted);font-size:15px;line-height:1.45;max-width:30ch}
  nav{width:100%;display:flex;flex-direction:column;gap:12px}
  a.btn{
    display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:14px 18px;
    border-radius:16px;text-decoration:none;color:var(--ivory);font-weight:650;font-size:16px;
    background:var(--card);border:1px solid var(--line);
    transition:transform .12s ease, background-color .12s ease, border-color .12s ease;
  }
  a.btn:hover{background:#243766;border-color:#3a5089}
  a.btn:active{transform:scale(.98)}
  a.btn:focus-visible{outline:3px solid var(--orange-2);outline-offset:3px}
  a.btn .ic{width:28px;height:28px;flex:none;display:grid;place-items:center}
  a.btn .ic svg{width:24px;height:24px}
  a.btn .sub{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:2px}
  a.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--navy);min-height:68px}
  a.btn.primary:hover{background:var(--orange-2);border-color:var(--orange-2)}
  a.btn.primary .sub{color:#3a2a14}
  a.btn .arrow{margin-left:auto;opacity:.6}
  .label{align-self:flex-start;color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;margin:6px 4px -4px}
  footer{color:#6f7a96;font-size:12px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <!-- Replace logo.png with the K1 studio logo (1024x1024). Fallback tile shows until then. -->
    <img class="logo" src="logo.png" alt="yh_design Games logo" width="112" height="112"
         onerror="this.outerHTML='<div class=&quot;logo-fallback&quot; aria-hidden=&quot;true&quot;>yh</div>'">
    <h1>yh_design Games</h1>
    <p class="tag">Simple, fun mobile games. Dice, puzzles and more.</p>
  </header>

  <nav aria-label="Links">
    <a class="btn primary" id="play" href="https://play.google.com/store/apps/dev?id=8921494143832853697">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2.8v18.4c0 .5.5.8.9.6l16-9.2c.4-.2.4-.8 0-1L4.9 2.2c-.4-.2-.9.1-.9.6z"/></svg>
      </span>
      <span>Get our games on Google Play<span class="sub">Free to download</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <p class="label">Follow us</p>

    <a class="btn" href="https://www.tiktok.com/@yhdesign.games">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 3h3c.2 1.7 1.4 3.1 3 3.4v3a7 7 0 0 1-3-.9V15a6 6 0 1 1-6-6c.3 0 .7 0 1 .1v3.1a3 3 0 1 0 2 2.8V3z"/></svg>
      </span>
      <span>TikTok<span class="sub">@yhdesign.games</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <a class="btn" href="https://www.youtube.com/@yhdesigngames">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3L10 15z"/></svg>
      </span>
      <span>YouTube<span class="sub">@yhdesigngames</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <a class="btn" href="https://www.instagram.com/yhdesigngames/">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </span>
      <span>Instagram<span class="sub">@yhdesigngames</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>

    <a class="btn" id="facebook" href="https://www.facebook.com/profile.php?id=61596623402448">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4.5h-3c-2.5 0-4 1.6-4 4V11H7.5v3.5H10V21h3.6v-6.5h2.9L17 11h-3.4V8.8c0-.5.3-.8.4-.8z"/></svg>
      </span>
      <span>Facebook<span class="sub">yhdesign Games</span></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </nav>

  <footer>© 2026 yh_design Games</footer>
</main>

<script>
  // Pass the visitor's source (?src=tiktok) on to Google Play, so installs per channel show in Play Console.
  (function () {
    try {
      var src = new URLSearchParams(location.search).get('src');
      if (!src || !/^[a-z0-9_-]{1,30}$/i.test(src)) return;
      var a = document.getElementById('play');
      var u = new URL(a.href);
      u.searchParams.set('utm_source', 'linkhub_' + src.toLowerCase());
      u.searchParams.set('utm_medium', 'social');
      u.searchParams.set('utm_campaign', 'linkhub');
      a.href = u.toString();
    } catch (e) {}
  })();
</script>
</body>
</html>
